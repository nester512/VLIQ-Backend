<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6C4CF0" />
    <title>VLIQ</title>

    <!-- Telegram WebApp SDK: injects window.Telegram.WebApp when opened inside Telegram. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Synchronous theme bootstrap — runs BEFORE first paint so we never flash
         a white frame at users on Telegram dark theme. -->
    <script>
      (function () {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          // Default to dark (matches Telegram's production default + splash colour).
          // Only switch to light if Telegram explicitly says so.
          var isLight = tg && tg.colorScheme === 'light';
          if (!isLight) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = isLight ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ===== Initial splash — shown before React mounts =====
         Background is a brand-tinted deep navy that reads correctly in both
         themes — avoids the white-flash → dark-flip seen by Telegram users
         whose system theme is light but Telegram theme is dark. */
      html, body { height: 100%; margin: 0; background: #0E1621; }
      body {
        background:
          radial-gradient(900px 600px at 12% -5%, rgba(108, 76, 240, 0.18) 0%, transparent 55%),
          radial-gradient(900px 700px at 100% 110%, rgba(108, 76, 240, 0.12) 0%, transparent 55%),
          #0E1621;
        font-family: 'Onest', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #ffffff;
      }
      #vliq-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px;
        opacity: 1; transition: opacity .25s ease; z-index: 9999;
        pointer-events: none;
        background:
          radial-gradient(900px 600px at 12% -5%, rgba(108, 76, 240, 0.18) 0%, transparent 55%),
          radial-gradient(900px 700px at 100% 110%, rgba(108, 76, 240, 0.12) 0%, transparent 55%),
          #0E1621;
      }
      #vliq-splash.hidden { opacity: 0; }
      .vliq-logo {
        width: 88px; height: 88px; border-radius: 26px;
        background: linear-gradient(135deg, #6C4CF0, #9B6BFF);
        display: grid; place-items: center;
        box-shadow: 0 22px 50px -16px rgba(108, 76, 240, .55);
        animation: vliq-pulse 1.8s ease-in-out infinite;
      }
      .vliq-logo svg { width: 44px; height: 44px; color: #fff; }
      .vliq-title {
        font-size: 26px; font-weight: 800; letter-spacing: -.6px;
      }
      .vliq-hint {
        font-size: 13px; font-weight: 500; color: #7E8B99;
      }
      .vliq-dots {
        display: flex; gap: 7px; margin-top: 4px;
      }
      .vliq-dots span {
        width: 7px; height: 7px; border-radius: 50%;
        background: #6C4CF0; opacity: .35;
        animation: vliq-dot 1.2s ease-in-out infinite;
      }
      .vliq-dots span:nth-child(2) { animation-delay: .15s; }
      .vliq-dots span:nth-child(3) { animation-delay: .3s; }
      @keyframes vliq-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 22px 50px -16px rgba(108, 76, 240, .55); }
        50%      { transform: scale(1.05); box-shadow: 0 28px 60px -14px rgba(108, 76, 240, .7); }
      }
      @keyframes vliq-dot {
        0%, 80%, 100% { opacity: .35; transform: scale(1); }
        40%           { opacity: 1;   transform: scale(1.25); }
      }
    </style>
  </head>
  <body>
    <div id="vliq-splash" aria-hidden="true">
      <div class="vliq-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 3v18l2-1.5L9 21l2-1.5L13 21l2-1.5L17 21l2-1.5V3" />
          <path d="M8 8h8M8 12h8M8 16h5" />
        </svg>
      </div>
      <div style="text-align:center">
        <div class="vliq-title">VLIQ</div>
        <div class="vliq-hint">Загружаем приложение</div>
      </div>
      <div class="vliq-dots"><span></span><span></span><span></span></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
