name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer PR run makes the older result irrelevant. Main deployments must
  # finish and are additionally serialized by the deploy job below.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  POETRY_VERSION: "1.8.5"
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vliq-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vliq-frontend

jobs:
  backend-quality:
    name: Backend / Ruff + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET_SALT: ci-only-jwt-secret
      TG_BOT_TOKEN: 1:ci-only-token
      POSTGRES__POSTGRES_URL: postgresql+asyncpg://vliq:vliq_dev@localhost:5432/vliq_test
      TEST_PG_URL: postgresql+asyncpg://vliq:vliq_dev@localhost:5432/vliq_test
      RECEIPT_STORAGE: local
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry and dependencies
        run: |
          python -m pip install --disable-pip-version-check "poetry==${POETRY_VERSION}"
          poetry install --no-root --with dev

      - name: Ruff
        run: poetry run ruff check src tests

      - name: Unit and functional tests
        run: >-
          poetry run pytest
          --ignore=tests/integration
          --ignore=tests/migrations
          -q

  backend-postgres:
    name: Backend / PostgreSQL + migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vliq_test
          POSTGRES_USER: vliq
          POSTGRES_PASSWORD: vliq_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vliq -d vliq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET_SALT: ci-only-jwt-secret
      TG_BOT_TOKEN: 1:ci-only-token
      POSTGRES__POSTGRES_URL: postgresql+asyncpg://vliq:vliq_dev@localhost:5432/vliq_test
      TEST_PG_URL: postgresql+asyncpg://vliq:vliq_dev@localhost:5432/vliq_test
      RECEIPT_STORAGE: local
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry and dependencies
        run: |
          python -m pip install --disable-pip-version-check "poetry==${POETRY_VERSION}"
          poetry install --no-root --with dev

      - name: Real PostgreSQL and migration tests
        run: poetry run pytest tests/migrations tests/integration/pg -q

  frontend:
    name: Frontend / lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: TypeScript and production build
        run: npm run build

  images:
    name: Containers / build${{ github.ref == 'refs/heads/main' && ' + publish' || '' }}
    needs: [backend-quality, backend-postgres, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./backend
          target: runtime
          push: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:test-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./frontend
          target: runtime
          push: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:test-latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-test:
    name: Deploy / shamilara.fun
    needs: [images]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://shamilara.fun
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Authenticate test server to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          printf -v GHCR_USER_QUOTED '%q' "$GHCR_USER"
          printf '%s' "$GHCR_TOKEN" | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io --username $GHCR_USER_QUOTED --password-stdin"

      - name: Deploy immutable revision
        env:
          SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          SSH_USER: ${{ secrets.TEST_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.TEST_DEPLOY_PATH }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -eu; cd '$DEPLOY_PATH'; git fetch --prune origin main; git checkout --detach '${{ github.sha }}'; IMAGE_TAG='${{ github.sha }}' DEPLOY_HEALTH_URL='https://shamilara.fun/health' ./ops/deploy-test.sh"
