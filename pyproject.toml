[tool.poetry]
name = "vliq-backend"
version = "0.1.0"
description = "VLIQ loyalty/bonus backend — entity scaffold"
authors = ["Vlad Nesterov nestvlad2004@gmail.com"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
fastapi = "^0.124.4"
uvicorn = "0.38.0"
SQLAlchemy = "^2.0.45"
asyncpg = "^0.30.0"
pydantic = "^2.9.2"
pydantic-settings = "^2.2.1"
alembic = "^1.14.0"
orjson = "^3.11.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
mypy = "^1.17.1"
ruff = "^0.12.9"
black = "^25.1.0"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | dist
  | build
  | migrations
  | alembic
)/
'''

[tool.isort]
profile = "black"
line_length = 120
py_version = 312
src_paths = ["src", "tests"]
known_first_party = ["src"]
combine_as_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations", "alembic", "dist", "build"]

[tool.ruff.lint]
select = ["F","E","W","I","UP","B","C4","PIE","PT","SIM","PL"]
ignore = ["E501"]
