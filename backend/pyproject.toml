[tool.poetry]
name = "vliq-backend"
version = "0.1.0"
description = "VLIQ loyalty/bonus backend — entity scaffold"
authors = ["Vlad Nesterov nestvlad2004@gmail.com"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
fastapi = "^0.143.0"
uvicorn = "^0.54.0"
SQLAlchemy = "^2.1.4"
asyncpg = "^0.32.0"
greenlet = "^3.5.6"
pydantic = ">=2.13,<2.14"  # aiogram 3.31 caps pydantic <2.14
pydantic-settings = "^2.15.0"
alembic = "^1.20.0"
orjson = "^3.13.0"
python-jose = "^3.5.0"
structlog = "^26.1.0"
httpx = "^0.28.1"                    # async HTTP for OFD client (OCR sprint)
python-multipart = "^0.0.32"        # multipart upload for receipt files
slowapi = "^0.1.10"                 # rate limiting (will be wired in P1)
pyjwt = "^2.15.1"                     # future migration from python-jose (H1)

# Sprint 1 / OCR pipeline deps
zxing-cpp = "^3.1.1"                # QR decode — no native libzbar required
Pillow = "^12.3.0"                  # image open for phash + QR
pypdfium2 = "^5.14.0"           # PDF page rasterization → QR (pure manylinux wheel, permissive)
imagehash = "^4.3.2"                # perceptual hash (phash) for near-duplicate detection
arq = "^0.28.0"                     # asyncio-native task queue (same event loop as FastAPI)
redis = {version = ">=5.3,<6", extras = ["hiredis"]}  # arq 0.28 caps redis <6
rapidfuzz = "^3.14.6"                # fuzzy SKU name matching
cryptography = "^50.0.2"            # Fernet encryption for payout_encrypted (H4, API-agent)
aioboto3 = "^15.5.0"
aiogram = "^3.31.0"                 # Telegram Bot framework (long polling for dev)
aiohttp = "^3.14.4"
prometheus-fastapi-instrumentator = ">=8.1.0"  # FastAPI /metrics endpoint (Prometheus format)
prometheus-client = ">=0.26.0"       # Custom counters/histograms/gauges

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
mypy = "^2.4.0"
ruff = "^0.16.10"
black = "^26.10.0"
isort = "^9.0.2"
respx = "^0.23.1"                    # mock httpx in tests
moto = {extras = ["s3"], version = "^5.2.3"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py314"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | dist
  | build
  | migrations
  | alembic
)/
'''

[tool.isort]
profile = "black"
line_length = 120
py_version = 314
src_paths = ["src", "tests"]
known_first_party = ["src"]
combine_as_imports = true

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["migrations", "alembic", "dist", "build"]

[tool.ruff.lint]
select = ["F","E","W","I","UP","B","C4","PIE","PT","SIM","PL"]
ignore = [
    "E501",
    # FastAPI / Security idioms — Depends() and Security() in parameter defaults
    # are the *official* FastAPI pattern; flagging them as B008 is noise.
    "B008",
    # SIM117 would collapse nested `with` blocks that are intentionally separate
    # (e.g. outer session + inner begin() in receipt router for readability).
    "SIM117",
    # B904 (raise-without-from) fires on re-raises that deliberately hide the
    # original error context (e.g. auth token errors where leaking internals is
    # undesirable). Not worth a blanket fix.
    "B904",
    # PLC0415: tests and optional-dependency code (arq, rapidfuzz) intentionally
    # import inside functions so env vars are set before app modules are loaded,
    # or to guard optional heavy imports. Allow globally; tighten if needed.
    "PLC0415",
    # PLR0917 (ruff 0.16): FastAPI handlers take path/query/body + Depends() params
    # positionally by design — the PLR0913 budget already caps their size.
    "PLR0917",
    # UP042 (str, Enum) → StrEnum changes str()/format() of statuses; deliberately
    # NOT part of the toolchain upgrade (behaviour change) — separate task.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# HTTP status codes (200, 401, 403, …) in test assertions are self-documenting;
# extracting them into named constants would hurt readability.
"tests/**" = ["PLR2004"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: full business-process integration smoke tests (require mock DB session)",
]
